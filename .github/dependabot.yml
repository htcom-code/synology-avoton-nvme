version: 2
updates:
  # The only dependency ecosystem here. The build itself pins its inputs by sha256 in
  # versions/*.env (Synology archives) and uses the debian:bookworm image.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns: ["*"]
